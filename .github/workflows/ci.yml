name: ci (PR, offline, $0)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ZERDE_CACHE_DB: law-registry reads (37-row law_metadata fixture). Points at a
#   /tmp COPY, never the committed file: CacheManager.__init__ lets ZERDE_CACHE_DB
#   OVERRIDE an explicit db_path, so constructing any CacheManager would otherwise
#   create tables in / write to the committed fixture. The copy absorbs that.
# CACHE_DB_PATH: writable scratch for settings.cache_db_path writers.
# ZERDE_NO_BGE=1: conftest blocks real BGE-M3 loads, so any test that touches
#   torch/semantics without the `heavy` marker fails loudly instead of trying to
#   download ~2.3GB on CI (guards marker completeness).
# -m "not heavy and not llm": skip BGE/torch + full-corpus tests (heavy) and any
#   token-spending LLM tests (llm).
env:
  ZERDE_CACHE_DB: /tmp/law_metadata_ci.db
  CACHE_DB_PATH: /tmp/zerde_ci_scratch.db
  ZERDE_NO_BGE: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch first, then project + backend deps)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
          pip install -r web/backend/requirements.txt
      - name: Copy law_metadata fixture to a writable /tmp path (protect the committed file)
        run: cp tests/fixtures/law_metadata.db /tmp/law_metadata_ci.db
      - name: Ruff (non-blocking)   # TODO: flip to blocking after repo-wide ruff cleanup
        continue-on-error: true
        run: ruff check .
      - name: Pytest core (offline, blocking — expect 0 failed)
        run: PYTHONPATH=. python -m pytest -q -m "not heavy and not llm"
      - name: Pytest web backend (offline, blocking — stubbed pipeline)
        run: PYTHONPATH=.:web/backend python -m pytest web/backend/tests/ -q
      - name: Mypy (non-blocking — 133 known errors)
        continue-on-error: true
        run: mypy zerde
      - name: lawid consistency (non-blocking drift monitor)
        continue-on-error: true
        run: PYTHONPATH=. python scripts/eval/lawid_consistency.py
