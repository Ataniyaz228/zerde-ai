[project]
name = "zerde"
version = "6.2.0"
description = "Legal AI Pipeline для Республики Казахстан"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Core
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",

    # LLM
    "openai>=1.30.0",

    # Document Parsing
    "pymupdf>=1.24.0",         # PDF extraction + OCR fallback
    "python-docx>=1.1.0",      # DOCX parsing

    # Web Scraping
    "beautifulsoup4>=4.12.0",  # HTML parsing
    "selectolax>=0.3.21",      # Fast CSS selectors

    # Search
    "tavily-python>=0.3.3",    # Tavily Search API

    # Dedup / NLP
    "numpy>=1.26.0",           # Cosine similarity
    "rank-bm25>=0.2.2",        # BM25 scoring (Auditor)

    # Math validation
    "sympy>=1.12",             # Arithmetic verification

    # Language detection
    "langdetect>=1.0.9",       # Language detection (Этап 1)

    # Reliability / Retry
    "tenacity>=8.3.0",         # Retry with backoff

    # Encoding detection
    "chardet>=5.2.0",          # TXT encoding detection
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[project.scripts]
zerde = "main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
