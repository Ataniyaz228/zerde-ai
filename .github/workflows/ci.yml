name: ci (PR, offline, $0)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHE_DB_PATH: tests/fixtures/law_metadata.db
  ZERDE_CACHE_DB: tests/fixtures/law_metadata.db

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch first, then project)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Ruff (non-blocking)   # TODO: flip to blocking after repo-wide ruff cleanup
        continue-on-error: true
        run: ruff check .
      - name: Pytest (offline, blocking — expect 0 failed)
        run: PYTHONPATH=. python -m pytest -q
      - name: Mypy (non-blocking — 133 known errors)
        continue-on-error: true
        run: mypy zerde
      - name: lawid consistency (non-blocking drift monitor)
        continue-on-error: true
        run: PYTHONPATH=. python scripts/eval/lawid_consistency.py
